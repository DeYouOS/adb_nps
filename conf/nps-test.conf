#############################################
# NPS-MCP 测试配置
# 端口全部偏移，避免与正在运行的旧 NPS 冲突
#############################################
appname=nps
runmode=pro
secure_mode=false
dns_server=8.8.8.8

#############################################
# 域名代理（测试时禁用，避免抢占 80/443）
#############################################
http_proxy_ip=0.0.0.0
http_proxy_port=0
https_proxy_port=0

#############################################
# 客户端连接（端口偏移 +10000）
#############################################
bridge_ip=0.0.0.0
bridge_tcp_port=18024
bridge_kcp_port=18024
bridge_tls_port=0
bridge_quic_port=0
bridge_ws_port=0
bridge_wss_port=0
bridge_path=/ws
bridge_select_mode=Primary

# 沿用旧配置的公钥
public_vkey=nps2026secure

# P2P 禁用（测试不需要）
p2p_port=0

disconnect_timeout=60

#############################################
# Web 管理（端口偏移）
#############################################
web_host=101.34.243.224
web_username=admin
web_password=Aa12345678
web_ip=0.0.0.0
web_port=18081
web_open_ssl=false

# 沿用旧 API 密钥
auth_key=
auth_crypt_key=Nps2026SecKey16!

#############################################
# 功能开关
#############################################
allow_flow_limit=false
allow_rate_limit=false
allow_tunnel_num_limit=false
allow_local_proxy=false
allow_connection_num_limit=false
allow_multi_ip=false
system_info_display=true

#############################################
# 日志
#############################################
log=stdout
log_level=info

#############################################
# MCP 服务配置（AI 远程调试接口）
#############################################
mcp_port=8028
mcp_auth_key=
mcp_adb_addr=127.0.0.1:5037
mcp_adb_connect_addr=101.34.243.224:15555
